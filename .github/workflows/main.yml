name: Build Angelead VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'Angelead.vst3' | Select-Object -First 1
          if (-not $dll) { throw 'Angelead.vst3 binary not found' }
          if ($dll.Length -lt 100000) { throw "Binary looks too small: $($dll.Length) bytes" }
          Write-Host "Found: $($dll.FullName) ($($dll.Length) bytes)"
          $dest = 'out/Angelead.vst3/Contents/x86_64-win'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $dll.FullName -Destination "$dest/Angelead.vst3"
          Get-ChildItem out -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Angelead-VST3
          path: out
          include-hidden-files: true
          if-no-files-found: error
