name: Build Angelead VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter 'Angelead.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'Angelead.vst3 not found' }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $vst3.FullName -Destination out -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: Angelead-VST3
          path: out
